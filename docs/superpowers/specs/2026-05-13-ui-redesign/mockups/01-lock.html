<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>01 · Lock — InkFrame v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<script src="_components.js"></script>
<style>
  .lock-page { position: relative; width: 100vw; height: 100vh; background: var(--surface-canvas); overflow: hidden; }
  .deco-I {
    position: absolute; left: -80px; bottom: -260px;
    font-family: var(--ff-serif); font-weight: 300;
    font-size: 720px; line-height: 0.8;
    color: var(--fg-4); opacity: 0.16;
    pointer-events: none; user-select: none;
  }
  .lock-top { position: absolute; top: 14px; right: 18px; display: flex; gap: 6px; z-index: 3; }
  .lang-chip {
    display: inline-flex; align-items: center;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-family: var(--ff-mono);
    font-size: 11px;
    background: var(--surface-1);
  }
  .lang-chip span { padding: 4px 10px; color: var(--fg-3); }
  .lang-chip span.on { color: var(--accent); background: var(--surface-2); }
  .lang-chip .div { padding: 4px 2px; color: var(--fg-4); }
  .lock-win { position: absolute; top: 8px; right: 8px; z-index: 3; }

  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 2;
  }
  .brand {
    font-family: var(--ff-serif);
    font-weight: 300;
    font-size: 72px;
    line-height: 1;
    color: var(--fg-1);
    letter-spacing: 0.01em;
  }
  .brand .sep { color: var(--accent); margin: 0 2px; }
  .subtitle {
    margin-top: 18px;
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.42em;
    color: var(--fg-3);
    text-transform: uppercase;
  }

  .form {
    margin-top: 64px;
    width: 420px;
    display: flex; flex-direction: column;
    gap: 18px;
  }
  .form .underline-input { width: 100%; }
  .form .help {
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--fg-3);
    line-height: 1.7;
    letter-spacing: 0.04em;
  }
  .form .help b { color: var(--fg-2); font-weight: 500; }
  .form ink-btn { width: 100%; }

  .footer-mono {
    position: absolute; left: 24px; bottom: 18px;
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.08em;
  }
  .footer-mono .dim { color: var(--fg-4); }
  .footer-right {
    position: absolute; right: 24px; bottom: 18px;
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="lock-page">
  <div class="deco-I">I</div>

  <div class="lock-top">
    <div class="lang-chip">
      <span class="on">中</span><span class="div">/</span><span>EN</span>
    </div>
  </div>
  <div class="lock-win"><ink-win-ctrl></ink-win-ctrl></div>

  <div class="center">
    <div class="brand">Ink<span class="sep">/</span>Frame</div>
    <div class="subtitle">A Desk For Storyboarders</div>

    <div class="form">
      <div class="underline-input">
        <input type="password" placeholder="Paste provider key…" value="••••••••••••••••••••" />
        <span class="eye">◉</span>
      </div>
      <div class="help">
        Keys never leave this machine. Stored in your <b>OS keychain</b>.<br>
        We don't phone home. Once you unlock, the desk is yours.
      </div>
      <ink-btn variant="cta">Unlock</ink-btn>
    </div>
  </div>

  <div class="footer-mono">v0.14.2 <span class="dim">·</span> 3f8c91a</div>
  <div class="footer-right">OFFLINE · LOCAL ONLY</div>
</div>

<ink-mock-nav></ink-mock-nav>
</body>
</html>
