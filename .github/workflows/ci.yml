# InkFrame CI
# 触发：push 到 main / 任何 PR（含 fork PR）。三条并行 job：analyze / test / golden。
# Runner 用 ubuntu-latest 控成本，macOS/Windows 烟测放到 release 流水线。
#
# Fork PR 兼容性：本 workflow 不依赖任何 secrets，fork PR 可直接跑。
# 维护者：新增任何 ${{ secrets.XXX }} 之前请评估对 fork PR 的影响——
# 默认 fork PR 拿不到 secrets，相关 step 必须用 if 守卫。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 手动补跑:squash commit 的 body 若含 [skip ci](例如分支上跑过 update-goldens,
  # 机器人那条提交带此标记,squash 会把它并进 body),main 上三个 workflow 会被静默
  # 跳过、留不下绿色记录。此时用 Actions → ci → Run workflow(选 main)补一次。
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  analyze:
    name: analyze + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      # DIP + 生命周期铁律的硬闸门现由 test job 的 Dart 静态测试承担（不会因下方
      # custom_lint 临时非阻断而出现防护真空）：
      #   - test/quality/no_direct_instantiation_test.dart  （取代 check-direct-instantiation.sh）
      #   - test/quality/disposable_cleanup_test.dart        （取代 check-disposable-cleanup.sh）
      #   - test/quality/no_inline_styles_test.dart          （取代 check-inline-styles.sh）
      #   - test/quality/no_magic_strings_test.dart          （取代 check-magic-strings.sh）
      # 这些测试随 `flutter test --coverage` 阻断式执行，是铁律的回归靶子。
      #
      # 下方 custom_lint 是 AST 级增强（更精确，未来取代上述文本近似）。continue-on-error
      # 临时挂载：在 analysis_options.yaml 启用 plugins: - custom_lint 且把
      # riverpod_lint/custom_lint 升级到兼容 Dart 3.11+ dot-shorthand AST 的版本、本地
      # `dart run custom_lint` 跑通无 throw 之前，不作硬阻断（避免引入 per-file crash 栈
      # 或零规则假绿）。前置完成后去掉 continue-on-error 转为硬闸门。铁律防护在此期间
      # 不依赖本 step——已由上述 Dart 测试兜底。
      - name: custom_lint
        continue-on-error: true
        run: dart run custom_lint

  test:
    name: test + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inkframe
          POSTGRES_PASSWORD: inkframe
          POSTGRES_DB: inkframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inkframe"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_PG_URL: postgres://inkframe:inkframe@127.0.0.1:5432/inkframe_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter test --coverage
        run: flutter test --coverage
      - name: enforce coverage threshold (70%)
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 70
          # 排除：
          #   - main.dart 入口（DI 装配代码，常规不做单测）
          #   - media_kit 依赖的 service / widget（headless CI 无 GPU/native 层，
          #     手动回归覆盖，见 docs/internal/t5-manual-regression.md）
          #   - generated l10n
          #   - features/debug/**（kDebugMode-only Showcase，用户访问不到）
          exclude: 'lib/main.dart lib/features/canvas/widgets/video_lightbox.dart lib/services/media_kit_*.dart lib/core/di/video_player.dart lib/core/di/thumbnail.dart lib/l10n/generated/** lib/features/debug/**'
      # 覆盖率证据：把 lcov.info 作为 build artifact 上传，固化“≥70% 已达成”的可核对证据。
      - name: upload coverage report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  golden:
    name: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      # 跑 golden 测试 + 基线守卫：
      #   - 已有基线 PNG 却 ran==0 → 基线被误删 / 测试被 skip → 硬失败（exit 1）。
      #   - 还没有基线（bootstrap 期）→ ::warning:: 暴露空转，不阻断。
      # 基线只允许在 canonical ubuntu runner 上生成（update-goldens.yml workflow_dispatch
      # --update-goldens），禁止提交 Windows / macOS 本地生成的基线。
      - name: run golden tests + baseline guard
        run: |
          shopt -s globstar nullglob
          files=(test/**/*_golden_test.dart)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=golden job idle::no golden test files exist — golden job verified nothing"
            exit 0
          fi
          baselines=(test/**/goldens/*.png)
          flutter test "${files[@]}" --file-reporter "json:golden-report.json"
          ran=$(jq -s '[.[] | select(.type=="testDone" and .hidden != true and .skipped != true)] | length' golden-report.json)
          skipped=$(jq -s '[.[] | select(.type=="testDone" and .hidden != true and .skipped == true)] | length' golden-report.json)
          echo "golden tests: ran=$ran skipped=$skipped baselines=${#baselines[@]}"
          if [ "$ran" -eq 0 ]; then
            if [ ${#baselines[@]} -gt 0 ]; then
              echo "::error title=golden regression::${#baselines[@]} baseline PNG(s) exist but 0 golden tests ran — goldens were skipped or disabled; failing."
              exit 1
            fi
            echo "::warning title=golden bootstrap pending::no baselines yet — run the update-goldens workflow on ubuntu to mint + commit them (see test/features/canvas/widgets/node_card_golden_test.dart)"
          fi

  release-scripts:
    name: release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # release-tag.sh 回归测试（gh 已 PATH-stub、git 身份 per-repo 设置）。
      # 修复 S8-8：该测试此前无任何 workflow 调用，发布脚本回归零 CI 保护。
      - name: release-tag.sh regression test
        run: |
          git config --global user.email "ci@inkframe.test"
          git config --global user.name "InkFrame CI"
          bash test/scripts/release_tag_test.sh
      # fetch-binaries.sh 回归测试（PKG-2A：upstream/bucket 双模式，curl/brew 全 PATH-stub 零网络）。
      - name: fetch-binaries.sh regression test
        run: bash test/scripts/fetch_binaries_test.sh
