name: secret-scan

# 常驻 gitleaks 扫描，防新引入 secret。
# 触发：push 到 main / dev，所有 PR（含 fork PR）。
# 维护：仓库公开后 GitHub 提供免费 Action 额度，对个人 OSS repo 不需要 GITLEAKS_LICENSE。

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
