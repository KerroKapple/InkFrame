name: 💡 Feature Request
description: 想加一个新能力，或扩展现有节点 / Provider / 工作流
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        InkFrame 是 **本地优先 + BYOK + 桌面原生** 的工具。提建议前请确认你的方案不破坏这三条底线。

        **不接的方向**（会被直接关）：
        - 远程托管 / 云端账号 / 服务端中转 API key
        - Web / 移动端移植
        - 修改 SOLID / 零硬编码 / DI 等架构铁律

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 先讲创作场景和痛点，不要直接讲实现
      placeholder: |
        例：当前从 image 节点连到 video 节点时，每次都得手动选 provider 和 duration。我经常做"图生视频"，想要一个"使用上次配置"的快捷动作。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 心里的方案
      description: 涉及 UI 的画几笔草图，涉及 API 的写下接口签名
      placeholder: |
        在 video Inspector 加一个 "继承上次配置" 按钮，点击后…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - UI / Widget（features/<module>/widgets）
        - 状态层（providers / state）
        - 数据层（schema / repository）
        - Provider 适配器（providers/）
        - 工程基建（CI / hooks / scripts）
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: alignment
    attributes:
      label: 与项目铁律对齐自检
      options:
        - label: 不引入远程账号 / 服务端中转
          required: true
        - label: 不破坏零硬编码（颜色 / 文案走 token + i18n）
          required: true
        - label: 不破坏 SOLID / DI（不引入静态 singleton 或 ServiceLocator）
          required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 是否愿意自己提 PR 实现
      options:
        - label: 我可以尝试自己实现（先讨论方向再动手）
        - label: 需要更多讨论才能动手
