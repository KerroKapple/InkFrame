name: inkframe
description: "InkFrame — 开源本地优先的 AI 影视创作工作站 (Flutter Desktop)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 不可变模型
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 国际化 / 格式化
  intl: ^0.20.2

  # 日志基础设施
  logging: ^1.3.0

  # 平台路径（日志/配置目录）
  path_provider: ^2.1.5
  path: ^1.9.0

  # 核心 Material / Cupertino
  cupertino_icons: ^1.0.8

  # 嵌入式 PostgreSQL 客户端（T2 存储层）
  postgres: ^3.5.9

  # UUID 生成（repository 主键、测试装置）
  uuid: ^4.5.3

  # HTTP 客户端（Provider 层）
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0

  # T5：视频播放 + 首帧抽帧
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  # Provider 层 HTTP mock
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true  # 启用 flutter gen-l10n
